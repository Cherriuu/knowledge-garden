<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Garden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f7ee;
            font-family: 'Georgia', serif;
        }
 
        .container {
            text-align: center;
            padding: 3rem 2rem;
        }
 
        .emoji {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }
 
        h1 {
            font-size: 2.8rem;
            color: #3a6b35;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        h1 a{
            color: #3a6b35;
            text-decoration: none;
        }

        h1 a:hover {
            color: #E6A8C0;
            transition: color 0.2s ease
        }

        li a{
            color: #3a6b35;
            text-decoration: none;
        }

        ul {
            font-size: 1.1rem;
            color: #6a8f65;
            max-width: 380px;
            line-height: 1.8;
            text-align: left;
            display: inline-block;
        }

        p a, p a:visited {
            margin-top: 1rem;
            color: #3a6b35;
            text-decoration: none;
        }

        p a:hover {
            color: #E6A8C0;
            transition: color 0.2s ease;
        }
        

        p {
            font-size: 1.0rem;
            color: #3a6b35;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        li a:hover {
            color: #E6A8C0;
            transition: color 0.2s ease;
        }

        p.top-nav {
            position: absolute;
            top: 1rem;
            right: 1.3rem;
            margin: 0;
            font-size: 1.3rem;
            
        }

        p.top-nav a {
            color: #3a6b35;
            margin-top: 0;
        }

        p.top-nav a:hover {
            color: #E6A8C0;
            transition: color 0.2s ease;
        }

        form {
            margin: 1rem 0;
        }

        button {
            background: none;
            border: none;
            padding: 0.4rem 0.8rem;
            color: #3a6b35;
            font-size: 1.0rem;
            cursor: pointer;
            font-family: 'Georgia', serif;
        }

        button:hover {
            color: #E6A8C0;
            transition: color 0.2s ease;
        }

    </style>
</head>
<body>
    <p class="top-nav">
        {% if user.is_authenticated %}
        <a href="{% url 'users:logout' %}">log out</a>

        {% else %}
        <a href="{% url 'users:register' %}">register</a>
        {% endif %}

    </p>

    <div class="container">
        <span class="emoji">🌱</span>
            <h1>
                <a href ="{% url 'learning_log:index' %}">Knowledge Garden</a> -
                <a href = "{% url 'learning_log:topics' %}">Topics</a> -
                {% if user.is_authenticated %}
                Hello, {{user.username}}.
                {% else %}
                <a href="{% url 'users:login' %}">log in</a>
                {% endif %}
            </h1>

            {% block content %}{% endblock content %}
    </div>
</body>
</html>
