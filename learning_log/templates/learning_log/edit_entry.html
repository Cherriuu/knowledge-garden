{% extends "learning_log/base.html" %}

{% block content %}

<p><a href = "{% url 'learning_log:topic' topic.id %}">{{ topic }}</a></p>

<p>Edit entry:</p>

<form action = "{% url 'learning_log:edit_entry' entry.id %}" method="post">
{% csrf_token %}
{{form.as_p}}
<button name="submit">save changes</button>
</form>

<form action = "{% url 'learning_log:delete_entry' entry.id %}" method="post">
{% csrf_token %}
<button name="delete">delete entry</button>
</form>

{% endblock content %}
